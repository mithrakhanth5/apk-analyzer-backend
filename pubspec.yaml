name: apk_risk_analyzer
description: "Secure APK Security Analysis Tool - Pre-installation risk assessment for Android APK files"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # File handling
  file_picker: ^8.0.0
  
  # Cryptography for hashing
  crypto: ^3.0.3
  
  # HTTP client
  http: ^1.2.0
  
  # State management
  provider: ^6.1.0
  
  # Animations
  lottie: ^3.1.0
  
  # URL launcher for links
  url_launcher: ^6.2.0
  
  # Share functionality
  share_plus: ^7.2.0
  
  # Path provider
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/generated_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  
  assets:
    - assets/
    - assets/animations/
    - assets/icons/
